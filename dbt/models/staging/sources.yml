version: 2

sources:
  - name: silver
    description: Iceberg tables written by the Spark streams, read through the REST catalog.
    database: lake
    schema: silver
    loaded_at_field: processed_at
    # The stream commits every ~10 s; anything older than a few minutes means it is stuck.
    freshness:
      warn_after: {count: 5, period: minute}
      error_after: {count: 15, period: minute}
    tables:
      - name: edits
        description: One row per Wikimedia recentchange event, deduplicated on event_id.
        columns:
          - name: event_id
            tests: [not_null]
      - name: editor_sessions
        description: Closed editor sessions (session window, 20-minute gap).
        freshness: null  # sessions close 30+ minutes after they start; freshness is not meaningful
