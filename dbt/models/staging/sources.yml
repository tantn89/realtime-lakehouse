version: 2

sources:
  - name: silver
    description: Iceberg tables written by the Spark streams, read through the REST catalog.
    database: lake
    schema: silver
    # No dbt source freshness here: nothing runs `dbt source freshness`. Silver freshness is
    # the Dagster asset check silver_is_fresh (orchestration/lakehouse_checks.py), every 5 min.
    tables:
      - name: edits
        description: One row per Wikimedia recentchange event, deduplicated on event_id.
        columns:
          - name: event_id
            tests: [not_null]
      - name: editor_sessions
        description: Closed editor sessions (session window, 20-minute gap).
