# Local lakehouse: Kafka-compatible broker, S3-compatible storage, Iceberg REST catalog, Spark.
#   docker compose up -d --build
# Credentials below are local-only placeholders for the throwaway S3 store, not secrets.

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: lakehouse
  AWS_SECRET_ACCESS_KEY: lakehouse-local-only
  AWS_REGION: us-east-1

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30

  create-topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    # 3 partitions keyed by wiki; 7-day retention so a stopped pipeline can catch up.
    command:
      - rpk topic create wiki.recentchange -p 3 -c retention.ms=604800000 -X brokers=redpanda:9092 || true;
        rpk topic create wiki.recentchange.dlq -p 1 -X brokers=redpanda:9092 || true

  producer:
    build: {context: ., dockerfile: docker/producer/Dockerfile}
    image: realtime-lakehouse/producer:local
    restart: unless-stopped
    depends_on:
      create-topics: {condition: service_completed_successfully}
    environment:
      LAKEHOUSE_KAFKA_BOOTSTRAP: redpanda:9092
      # Wikimedia policy: identify the tool and a contact. Override for your own runs.
      WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-realtime-lakehouse/0.1 (https://github.com/tantn89/realtime-lakehouse)}
    volumes: [producer-state:/state]
    command: ["live"]

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes:
      - seaweedfs:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 and the S3 server listens on IPv4.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 30

  create-bucket:
    image: amazon/aws-cli:2.18.0
    depends_on:
      seaweedfs: {condition: service_healthy}
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket warehouse 2>/dev/null
        || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://warehouse

  # Catalog state (which metadata file is current for each table). Postgres, not SQLite:
  # three streams commit concurrently and SQLite fails them with "database is locked".
  catalog-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg-local-only
    volumes: [catalog:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      retries: 30

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    restart: unless-stopped
    depends_on:
      create-bucket: {condition: service_completed_successfully}
      catalog-db: {condition: service_healthy}
    ports: ["8181:8181"]
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:postgresql://catalog-db:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg-local-only

  stream:
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    image: realtime-lakehouse/spark:local
    restart: unless-stopped
    depends_on:
      create-topics: {condition: service_completed_successfully}
      iceberg-rest: {condition: service_started}
    environment: &spark-env
      <<: *s3-env
      LAKEHOUSE_CATALOG_URI: http://iceberg-rest:8181
      LAKEHOUSE_S3_ENDPOINT: http://seaweedfs:8333
      LAKEHOUSE_WAREHOUSE: s3://warehouse/
      LAKEHOUSE_KAFKA_BOOTSTRAP: redpanda:9092
    volumes: [checkpoints:/checkpoints]
    command: ["python", "-m", "wiki_lakehouse.streaming"]

  # SQL endpoint for orchestration: Dagster runs Iceberg maintenance through it.
  spark-connect:
    image: realtime-lakehouse/spark:local
    restart: unless-stopped
    depends_on:
      iceberg-rest: {condition: service_started}
      stream: {condition: service_started}  # same image; built by the stream service
    environment: *spark-env
    command: ["python", "-m", "wiki_lakehouse.spark_connect_server"]

  dagster-webserver:
    build: {context: ., dockerfile: docker/orchestration/Dockerfile}
    image: realtime-lakehouse/orchestration:local
    restart: unless-stopped
    depends_on:
      iceberg-rest: {condition: service_started}
    environment: &orchestration-env
      <<: *s3-env
      LAKEHOUSE_CATALOG_URI: http://iceberg-rest:8181
      LAKEHOUSE_S3_ENDPOINT: http://seaweedfs:8333
      LAKEHOUSE_KAFKA_BOOTSTRAP: redpanda:9092
      LAKEHOUSE_SPARK_CONNECT: sc://spark-connect:15002
    ports: ["3000:3000"]
    volumes: [dagster-home:/dagster_home, gold:/gold]
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000",
              "-m", "wiki_lakehouse.orchestration.definitions"]

  # Runs schedules; jobs execute in this container.
  dagster-daemon:
    image: realtime-lakehouse/orchestration:local
    restart: unless-stopped
    depends_on:
      dagster-webserver: {condition: service_started}  # same image, built by the webserver
      spark-connect: {condition: service_started}
    environment: *orchestration-env
    volumes: [dagster-home:/dagster_home, gold:/gold]
    command: ["dagster-daemon", "run", "-m", "wiki_lakehouse.orchestration.definitions"]

  # Toolbox for one-off Spark commands (smoke check, SQL, tests):
  #   docker compose run --rm spark python -m wiki_lakehouse.smoke_check
  spark:
    image: realtime-lakehouse/spark:local
    profiles: [tools]
    depends_on:
      iceberg-rest: {condition: service_started}
    environment: *spark-env
    command: ["python", "-m", "wiki_lakehouse.smoke_check"]

volumes:
  dagster-home:
  gold:
  producer-state:
  redpanda:
  seaweedfs:
  catalog:
  checkpoints:
