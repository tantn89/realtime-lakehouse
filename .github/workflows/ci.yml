name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest

  # Validate needs no credentials: variables are unknown, the provider is not configured.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  # Builds the orchestration image (which runs `dbt parse`) and loads the Dagster
  # definitions in it, and checks that every compose overlay still renders.
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values: the AWS overlay requires them, `config` only renders the file.
      AWS_REGION: ap-southeast-2
      LAKEHOUSE_WAREHOUSE: s3://example-bucket/warehouse/
      LAKEHOUSE_GLUE_ACCOUNT_ID: "123456789012"
    steps:
      - uses: actions/checkout@v4
      - name: Compose files render
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.it.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.aws.yml config -q
      - name: Build the orchestration image
        run: docker compose build dagster-webserver
      - name: Load the Dagster definitions
        run: >
          docker compose run --rm --no-deps -T dagster-webserver
          dagster definitions validate -m wiki_lakehouse.orchestration.definitions

  # Builds the images, runs the Spark unit tests inside the Spark image, then the full
  # crash-and-verify scenario: SIGKILL the stream mid-backlog and prove exactly-once.
  spark-and-exactly-once:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.it.yml -p lakehouse-it build stream producer
      - name: Spark unit tests
        run: >
          docker compose -f docker-compose.yml -f docker-compose.it.yml -p lakehouse-it
          run --rm --no-deps -v "$PWD/tests:/app/tests" -v "$PWD/data/recordings:/app/data/recordings"
          spark pytest -q tests/test_edit_transforms.py
      - name: Crash the stream and prove exactly-once
        run: python3 scripts/prove_exactly_once.py
